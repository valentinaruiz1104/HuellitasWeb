<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huellitas Web | Iniciar sesión</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">

    <!-- Google Sign-In script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            console.log("ID Token: " + response.credential);
            // Aquí puedes enviar el token a tu servidor para verificar
            // Por ahora, solo lo mostramos en consola
        }
    </script>
</head>
<body>

    <div class="login-container">
        <div class="login-panel">
            <div class="logo">
                <img src="img/esfera.png" alt="Esfera Huellitas Web">
            </div>
            <h1>Huellitas Web</h1>
            <p class="subtitle">
                Encuentra, adopta y conecta con mascotas desde cualquier lugar.
            </p>
        </div>

        <div class="login-form-panel">
            <form action="home.html">
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Contraseña" required>
                <a href="#" class="forgot" onclick="event.preventDefault(); openModal('recoverModal');">¿Olvidaste tu contraseña?</a>
                <button type="submit">Ingresar</button>
            </form>

            <div class="divider"><span>o continuar con</span></div>

            <div class="google-btn">
                <div id="g_id_onload"
                     data-client_id="TU_CLIENT_ID_AQUI"
                     data-callback="handleCredentialResponse"
                     data-auto_select="true">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="signin_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>

            <p class="register">
                ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>
    <div class="login-modal" id="recoverModal">
        <div class="login-modal-content login-container">
            <button class="login-modal-close" onclick="closeModal('recoverModal');">&times;</button>
            <div class="login-panel">
                <div class="logo"><img src="img/esfera.png" alt="Esfera Huellitas Web"></div>
                <h1>Recupera tu contraseña</h1>
                <p class="subtitle">Ingresa tu correo para recibir el enlace de recuperación.</p>
            </div>
            <div class="login-form-panel">
                <form action="#" onsubmit="event.preventDefault(); closeModal('recoverModal'); alert('Se envió el enlace de recuperación.');">
                    <input type="email" placeholder="Correo electrónico" required>
                    <button type="submit">Enviar enlace</button>
                </form>
                <p class="register">¿Recuerdas tu contraseña? <a href="#" onclick="event.preventDefault(); closeModal('recoverModal'); openModal('loginModal');">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>

    <script src="archivo.js"></script></body>
</html>
