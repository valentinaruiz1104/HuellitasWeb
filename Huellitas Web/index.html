<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huellitas Web | Iniciar sesión</title>

    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">

    <!-- Google Sign-In script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            console.log("ID Token: " + response.credential);
            // Aquí puedes enviar el token a tu servidor para verificar
            // Por ahora, solo lo mostramos en consola
        }
    </script>
</head>
<body>

    <div class="login-container">
        <div class="login-panel">
            <div class="logo">
                <img src="img/esfera.png" alt="Esfera Huellitas Web">
            </div>
            <h1>Huellitas Web</h1>
            <p class="subtitle">
                Encuentra, adopta y conecta con mascotas desde cualquier lugar.
            </p>
        </div>

        <div class="login-form-panel">
            <form action="home.html">
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Contraseña" required>
                <a href="recuperar.html" class="forgot">¿Olvidaste tu contraseña?</a>
                <button type="submit">Ingresar</button>
            </form>

            <div class="divider"><span>o continuar con</span></div>

            <div class="google-btn">
                <div id="g_id_onload"
                     data-client_id="TU_CLIENT_ID_AQUI"
                     data-callback="handleCredentialResponse"
                     data-auto_select="true">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="signin_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>

            <p class="register">
                ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>

</body>
</html>
